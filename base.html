<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Total Grace School{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header class="top"><div class="brand"><div class="crest">TG</div><div><strong>TOTAL GRACE SCHOOL</strong><small>Knowledge is light</small></div></div><nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('check_result') }}">Check result</a><a href="{{ url_for('admin_dashboard') }}">Admin</a></nav></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>© {{ 2026 }} TOTAL GRACE SCHOOL · Knowledge is light</footer></body></html>
